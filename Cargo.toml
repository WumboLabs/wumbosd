[package]
name = "wumbosd"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MPL-2.0"
description = "wumbOS user-session service daemon"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "signal", "net", "io-util", "fs", "sync"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
