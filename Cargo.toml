[package]
name = "wumbosd"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "signal", "net", "io-util", "fs"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
